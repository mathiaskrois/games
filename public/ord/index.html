<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f7f3">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Five letters. Six chances. Your own little word ritual, in Danish or English.">
  <title>Ord · A little word ritual</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../shared/style.css">
</head>
<body data-game="ord">
  <header class="site-header"><div class="header-inner">
    <a class="wordmark" href="../"><i aria-hidden="true">✦</i> KROIS<span>GAMES</span></a>
    <div class="header-actions"><div class="language" role="group" aria-label="Language"><button data-lang="en" aria-label="English">EN</button><button data-lang="da" aria-label="Dansk">DA</button></div><button id="help" class="icon-button" aria-label="How to play">?</button><button id="stats" class="icon-button" aria-label="Statistics">▥</button></div>
  </div></header>
  <div class="app">
    <a id="all-games" class="back-link" href="../">← All games</a>
    <main>
      <section class="intro" aria-labelledby="title"><p class="eyebrow" id="eyebrow">A LITTLE WORD RITUAL</p><h1 id="title">Ord<span>.</span></h1><p id="subtitle">Five letters. Six chances. A fresh start anytime.</p></section>
      <div class="game-meta"><span id="mode-label">UNLIMITED PLAY</span><span id="attempt-label">GUESS 1 OF 6</span></div>
      <div id="board" class="board" role="group" aria-label="Word board" tabindex="-1"></div>
      <p id="message" class="message" role="status" aria-live="polite"></p>
      <div id="keyboard" class="keyboard" role="group" aria-label="Keyboard"></div>
      <button id="result" class="result-link" hidden>View result →</button>
      <div class="legend" aria-label="Tile meanings"><span><i class="correct"></i><span id="legend-correct">Right spot</span></span><span><i class="present"></i><span id="legend-present">Wrong spot</span></span><span><i class="absent"></i><span id="legend-absent">Not in word</span></span></div>
    </main>
  </div>
  <footer class="site-footer"><span>KROIS GAMES</span><span id="local-note">Progress stays on this device</span></footer>
  <dialog id="dialog" aria-labelledby="dialog-title"><button id="close" class="close" aria-label="Close dialog">×</button><div id="dialog-content"></div></dialog>
  <div id="confetti" class="confetti" aria-hidden="true"></div>
  <script type="module" src="game.mjs"></script>
</body>
</html>
