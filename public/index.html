<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f6f2e9">
  <title>Krois Games</title>
  <link rel="icon" href="ord/icon.svg">
  <link rel="stylesheet" href="shared/style.css">
</head>
<body>
  <header class="site-header"><div class="header-inner">
    <a class="wordmark" href="./"><i aria-hidden="true">✦</i> KROIS<span>GAMES</span></a>
    <div class="header-actions"><div class="language" role="group"><button data-lang="en">EN</button><button data-lang="da">DA</button></div></div>
  </div></header>
  <main class="hub">
    <section class="hero">
      <div><h1 id="hub-title">Play a<br><em>little.</em></h1><p id="hub-intro">Wordplay, number puzzles, and a round of Snake. Pick a game and play at your own pace.</p></div>
      <div class="hero-art" aria-hidden="true"><div class="orbit"></div><span class="print-tile print-o">O</span><span class="print-tile print-eight">8</span><span class="print-tile print-snake">⌁</span><span class="print-spark">✦</span><span class="print-star">✦</span></div>
    </section>
    <section aria-labelledby="pick"><div class="section-rule"><h2 id="pick">Pick a game</h2></div><div id="catalog" class="catalog"></div></section>
  </main>
  <footer class="site-footer"><span>KROIS GAMES</span><span id="local-note">Progress stays on this device</span></footer>
  <script type="module" src="shared/hub.mjs"></script>
</body>
</html>
